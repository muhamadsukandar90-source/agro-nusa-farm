<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Nusa Farm</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  height: 100vh;

  /* Background kambing (lebih aman) */
  background-image: url('https://images.unsplash.com/photo-1560114928-40f1f1eb26a0?auto=format&fit=crop&w=1400&q=80');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* Overlay gelap */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  top: 0;
  left: 0;
}

/* Daun pojok */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    url('https://cdn-icons-png.flaticon.com/512/7662/7662033.png') top left no-repeat,
    url('https://cdn-icons-png.flaticon.com/512/7662/7662033.png') bottom right no-repeat;
  background-size: 120px;
  pointer-events: none;
  z-index: 1;
}

/* Box */
.container {
  position: relative;
  z-index: 2;
  background: rgba(0, 0, 0, 0.6);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  color: white;
  max-width: 500px;
}

/* Style */
h1 {
  color: #00ff88;
}

ul {
  list-style: none;
  margin-top: 15px;
}

ul li {
  margin: 8px 0;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="container">
  <h1>Agro Nusa Farm</h1>
  <p>Peternakan Domba Berkualitas, Sehat & Amanah</p>

  <ul>
    <li>✔️ Domba sehat & siap qurban</li>
    <li>✔️ Harga bersaing</li>
    <li>✔️ Bisa kirim ke lokasi</li>
  </ul>

  <a href="https://wa.me/6285175865344">
    <button>Hubungi WhatsApp</button>
  </a>
  background-image: url('kambing.jpg');
</div>

</body>
</html>
