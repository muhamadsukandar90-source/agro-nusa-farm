<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klik Ternak</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f7fa;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: white;
    }

    .logo {
      font-weight: 600;
      font-size: 20px;
      color: #2c7da0;
    }

    .menu a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
    }

    .menu a.active {
      background: #2c7da0;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
    }

    /* Hero */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 80px 50px;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text h1 {
      font-size: 32px;
      color: #2c7da0;
      margin-bottom: 20px;
    }

    .hero-text p {
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      background: #2c7da0;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      text-decoration: none;
      display: inline-block;
    }

    .hero img {
      width: 450px;
    }

    /* Responsive */
    @media(max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero img {
        width: 300px;
        margin-top: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Klik Ternak</div>
    <div class="menu">
      <a href="#" class="active">Beranda</a>
      <a href="#">Narasi</a>
      <a href="#">Produk</a>
      <a href="#">Tentang</a>
    </div>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>Yuk, Dukung Edukasi Peternakan Indonesia!</h1>
      <p>
        Klikternak hadir sebagai sumber informasi dan edukasi
        seputar peternakan. Mari bersama kita majukan peternakan Indonesia!
      </p>
      <a href="#" class="btn">Pelajari Lebih Lanjut</a>
    </div>

    <img src="https://cdn-icons-png.flaticon.com/512/1998/1998611.png" alt="Peternakan">
  </section>

</body>
</html>
