<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Nusa Farm</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Background gradasi hijau (AMAN TANPA GAMBAR) */
body {
  font-family: Arial, sans-serif;
  height: 100vh;
  background: linear-gradient(to bottom, #2e7d32, #a5d6a7);

  display: flex;
  justify-content: center;
  align-items: center;
}

/* Box utama */
.container {
  background: rgba(0, 0, 0, 0.6);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  color: white;
  max-width: 500px;
  animation: fadeIn 1s ease;
}

/* Judul */
h1 {
  color: #00ff88;
  margin-bottom: 10px;
}

/* Paragraf */
p {
  margin-bottom: 15px;
}

/* List */
ul {
  list-style: none;
}

ul li {
  margin: 8px 0;
}

/* Button */
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 16px;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: darkgreen;
  transform: scale(1.05);
}

/* Animasi */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

</head>

<body>

<div class="container">
  <h1>Agro Nusa Farm</h1>
  <p>Peternakan Domba Berkualitas, Sehat & Amanah</p>

  <ul>
    <li>✔️ Domba sehat & siap qurban</li>
    <li>✔️ Harga bersaing</li>
    <li>✔️ Bisa kirim ke lokasi</li>
  </ul>

  <a href="https://wa.me/6285175085344">
    <button>Hubungi WhatsApp</button>
  </a>
</div>

</body>
</html>
