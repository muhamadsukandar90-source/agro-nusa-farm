<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Nusa Farm</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  height: 100vh;

  /* Background kambing (FIX bukan kucing lagi) */
  background: url('https://images.unsplash.com/photo-1598514982526-5f2b2d7a1c1c?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* Overlay gelap biar teks jelas */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  top: 0;
  left: 0;
}

/* Hiasan daun */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    url('https://png.pngtree.com/png-clipart/20230806/original/pngtree-leaves-decoration-corner-green-picture-image_9875930.png') top left no-repeat,
    url('https://png.pngtree.com/png-clipart/20230806/original/pngtree-leaves-decoration-corner-green-picture-image_9875930.png') bottom right no-repeat;
  background-size: 180px;
  pointer-events: none;
  z-index: 1;
}

/* Box utama */
.container {
  position: relative;
  z-index: 2;
  background: rgba(0, 0, 0, 0.6);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  color: white;
  max-width: 500px;
  backdrop-filter: blur(6px);
  animation: fadeIn 1s ease;
}

/* Judul */
h1 {
  color: #00ff88;
  margin-bottom: 10px;
}

/* Subtext */
p {
  margin-bottom: 20px;
}

/* List */
ul {
  list-style: none;
}

ul li {
  margin: 10px 0;
}

/* Button */
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 16px;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

/* Hover */
button:hover {
  background: darkgreen;
  transform: scale(1.05);
}

/* Animasi masuk */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

</head>

<body>

<div class="container">
  <h1>Agro Nusa Farm</h1>
  <p>Peternakan Domba Berkualitas, Sehat & Amanah</p>

  <ul>
    <li>✔️ Domba sehat & siap qurban</li>
    <li>✔️ Harga bersaing</li>
    <li>✔️ Bisa kirim ke lokasi</li>
  </ul>

  <a href="https://wa.me/6285175865344">
    <button>Hubungi WhatsApp</button>
  </a>
</div>

</body>
</html>
